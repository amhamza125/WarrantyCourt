[build]
  command = "npm run build"
  publish = "dist"

# Explorer API proxy — the scan API sends no CORS headers, so tx backfill
# fetches go same-origin and are forwarded unchanged.
[[redirects]]
  from = "/api/explorer/*"
  to = "https://scan.bradbury.genlayer.com/api/v1/:splat"
  status = 200
  force = true

# SPA fallback — hash routes do the routing client-side; this keeps any
# deep path serving the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
